<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spiders</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img src="icon.png" alt=""><span>SPIDERS</span></div>

      <div class="group transport">
        <button id="homeBtn" class="icon ghost" title="Back to start (Enter)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM9.5 12L19 5v14z"/></svg></button>
        <button id="playBtn" title="Play / Stop (Space)"><svg viewBox="0 0 24 24" width="18" height="18"><path id="playIcon" d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg></button>
        <button id="recBtn" class="icon" title="Record onto the selected track (⌘R)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/></svg></button>
        <button id="loopBtn" class="icon toggle on" title="Loop the highlighted bars (⌘L)"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
        <button id="metroBtn" class="icon toggle" title="Metronome (⌘K)"><svg viewBox="0 0 24 24"><path d="M10 2h4l5 19H5zm1.3 2L8 17h3.2l4.6-7.6L13 4zm2.1 13h3.4l-1.4-5.4z"/></svg></button>
        <div class="pos" id="pos">1.1.1<small id="posTime">0:00.00</small></div>
      </div>

      <div class="group">
        <div class="field"><label>BPM</label><input id="bpm" type="number" min="30" max="300" step="1" value="120"></div>
        <div class="field"><label>Record quantize</label>
          <select id="quantize"><option>Off</option><option>1/4</option><option>1/8</option><option>1/8T</option><option selected>1/16</option><option>1/16T</option><option>1/32</option></select>
        </div>
      </div>

      <div class="spacer"></div>
      <span class="pill" id="midiPill" title="MIDI keyboards connected">MIDI: none</span>
      <div class="group">
        <div class="field"><label>Master</label><input id="master" type="range" min="0" max="1.2" step="0.01" value="0.8" style="width:80px"></div>
        <canvas id="meter" width="140" height="44" title="Output level"></canvas>
      </div>
      <div class="group files">
        <button id="newBtn" class="ghost" title="New project (⌘N)">New</button>
        <button id="openBtn" class="ghost" title="Open project (⌘O)">Open</button>
        <button id="saveBtn" class="ghost" title="Save project (⌘S)">Save</button>
        <button id="exportBtn" class="accent" title="Export WAV / MP3 / MIDI (⌘E)">Export</button>
      </div>
    </header>

    <main>
      <aside class="library">
        <div class="side-head"><h3>Sounds</h3><button id="importBtn" class="small">+ Import</button></div>
        <div id="sampleList" class="scroll"></div>
        <div id="libDetail" class="scroll" style="flex:1"></div>
      </aside>

      <section class="center">
        <div class="mapwrap" id="mapwrap">
          <canvas id="map"></canvas>
          <div class="map-bar" id="mapBar"></div>
          <div id="mapTip"></div>
          <div class="welcome" id="welcome">
            <div class="card">
              <img src="icon.png" alt="">
              <h2>Spin a sound into a web</h2>
              <p>Drop a WAV, MP3 or MIDI file here. Spiders slices it into frames, groups them by timbre and lays them out as cells you can play from the map, your keyboard or a MIDI keyboard.</p>
              <div class="btns"><button class="accent" id="welcomeImport">Import a sound…</button><button id="welcomeDemo">Try the demo sound</button></div>
            </div>
          </div>
        </div>
        <canvas id="strip" title="The whole sound, coloured by timbre group. Click or drag to play frames."></canvas>
        <div class="splitter" id="splitter" title="Drag to resize"></div>
        <div class="timeline" id="timelineWrap">
          <div class="tl-toolbar">
            <h3>Tracks</h3>
            <button id="addTrackBtn" class="small">+ Track</button>
            <div class="sep"></div>
            <span style="color:var(--dim)">Snap</span>
            <select id="snap"><option>Off</option><option>1 bar</option><option>1/4</option><option>1/8</option><option>1/8T</option><option selected>1/16</option><option>1/16T</option><option>1/32</option></select>
            <button id="quantizeBtn" class="small" title="Move the selected notes (or the whole track) onto the snap grid (⌘U)">Quantize</button>
            <div class="sep"></div>
            <span style="color:var(--dim)">Loop</span>
            <select id="loopLen" title="Loop length"><option value="4">1 bar</option><option value="8">2 bars</option><option value="16" selected>4 bars</option><option value="32">8 bars</option><option value="64">16 bars</option></select>
            <div style="flex:1"></div>
            <button id="zoomOut" class="small" title="Zoom out (⌘ scroll)">−</button>
            <button id="zoomIn" class="small" title="Zoom in (⌘ scroll)">+</button>
          </div>
          <div class="tl-body">
            <div class="tl-headers" id="trackHeaders"><div class="ruler-pad">click ruler: move · drag: set loop</div><div class="inner" id="trackHeadersInner"></div></div>
            <canvas id="timeline"></canvas>
          </div>
        </div>
      </section>

      <aside class="panel" id="panel">
        <div class="tabs" id="tabs">
          <button data-tab="pads" class="on">Pads</button>
          <button data-tab="sound">Sound</button>
          <button data-tab="effects">Effects</button>
        </div>
        <div class="panel-title" id="panelTitle"></div>
        <div class="panel-body scroll" id="panelBody"></div>
      </aside>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast"></div>
  <div id="ctxMenu"></div>
  <input type="file" id="fileInput" accept=".spiders,application/json" hidden>
  <input type="file" id="audioInput" accept=".wav,.mp3,.aif,.aiff,.flac,.ogg,.m4a,.aac,.mid,.midi,audio/*" multiple hidden>

  <script src="vendor/lame.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/midi-render.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/knob.js"></script>
  <script src="js/mapview.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
